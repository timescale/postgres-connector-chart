{{- $cfg := required "config: must be set (see live-sync/pkg/config/config.go for the schema)" .Values.config -}}
{{- if not (kindIs "map" $cfg) -}}
{{- fail "config: must be a YAML map matching live-sync/pkg/config/config.go" -}}
{{- end -}}
{{- if not $cfg.connectors -}}
{{- fail "config.connectors: at least one connector must be defined" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres-connector.fullname" . }}-config
  labels:
    {{- include "postgres-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- $cfg | toYaml | nindent 4 }}
