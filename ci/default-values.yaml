# CI fixture exercising the full chart with all toggles at their defaults.
# Credentials are placeholders that satisfy `$VAR` syntax in config.yaml —
# never actually executed in CI; only used to render the manifests.

image:
  tag: "latest"

config:
  version: 1
  connectors:
    - id: ci-test
      source:
        database_url: $SOURCE_URL
        publications:
          - ci_pub
      target:
        database_url: $TARGET_URL
        tables:
          - source:
              schema_name: public
              table_name: metrics
            hypertable_config:
              primary_dimension:
                column_name: time
                range:
                  partition_interval: 1 day

env:
  - name: SOURCE_URL
    value: postgres://user:pass@source:5432/db
  - name: TARGET_URL
    value: postgres://user:pass@target:5432/db
