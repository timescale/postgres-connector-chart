# CI fixture with only the values a user is required to supply.
# All optional toggles (ServiceMonitor, Grafana dashboard, PDB) are off
# or default to confirm the chart works without monitoring CRDs installed.

serviceMonitor:
  enabled: false
grafana:
  dashboard:
    enabled: false

config:
  version: 1
  connectors:
    - id: ci-min
      source:
        database_url: $SOURCE_URL
        publications:
          - ci_pub
      target:
        database_url: $TARGET_URL

env:
  - name: SOURCE_URL
    value: postgres://user:pass@source:5432/db
  - name: TARGET_URL
    value: postgres://user:pass@target:5432/db
